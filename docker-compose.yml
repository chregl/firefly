services:
  db:
    image: mariadb:11
    container_name: firefly-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=firefly
      - MYSQL_USER=firefly
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - /var/lib/fireflyiii/mysql:/var/lib/mysql
    networks:
      - firefly-net

  fireflyiii:
    image: fireflyiii/core:version-6.4.9
    container_name: fireflyiii
    restart: unless-stopped
    environment:
      - APP_KEY=${APP_KEY}
      - MEMORY_LIMIT=512M
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=${DB_PASSWORD}
      - TRUSTED_PROXIES=*
      - X_FORWARDED_PROTO=https
      - STATIC_CRON_TOKEN=${STATIC_CRON_TOKEN}
      - LOG_CHANNEL=stderr
      - APP_URL=https://aegcegext.duckdns.org
        # Reverse Proxy Auth
        # - AUTHENTICATION_GUARD=remote_user_guard
        # - REMOTE_USER_HEADER=X-Client-CN
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - /var/lib/fireflyiii/storage:/var/www/html/storage
      - /var/lib/fireflyiii/upload:/var/www/html/storage/upload
    networks:
      - firefly-net

  fireflyiii_cron:
    image: alpine
    container_name: fireflyiii_cron
    restart: unless-stopped
    environment:
      TZ: Europe/Zurich
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN}
    command: >
      sh -c '
        apk add --no-cache tzdata wget &&
        ln -sf /usr/share/zoneinfo/$$TZ /etc/localtime &&
        echo "0 3 * * * wget -qO- http://fireflyiii:8080/api/v1/cron/$$STATIC_CRON_TOKEN >/dev/null 2>&1" \
        | crontab - &&
        crond -f -L /dev/stdout
      '
    depends_on:
      - fireflyiii
    networks:
      - firefly-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: firefly-phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=${DB_ROOT_PASSWORD}
      - UPLOAD_LIMIT=128M
      - TZ=Europe/Zurich
    depends_on:
      - db
    ports:
      # Empfohlen: nur lokal binden ("127.0.0.1:8081:80"), da Auto-Login als root
      - "8081:80"
    networks:
      - firefly-net

  duckdns:
    image: linuxserver/duckdns
    container_name: duckdns
    restart: unless-stopped
    environment:
      - SUBDOMAINS=aegcegext
      - TOKEN=${DUCKDNS_TOKEN}
      - TZ=Europe/Zurich
    volumes:
      - /var/lib/duckdns:/config
    networks:
      - vpn-net

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    volumes:
      - /var/lib/caddy/data:/data
      - /var/lib/caddy/config:/config
      - /var/lib/caddy/certs:/certs:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - firefly-net
      - vpn-net

  wg-easy:
    # image: weejewel/wg-easy
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    restart: unless-stopped
    environment:
      - WG_HOST=aegcegext.duckdns.org
      - PASSWORD_HASH=${WG_PASSWORD_HASH}
      - WG_PORT=51820
      - WG_SUBNET=10.8.0.0/24
      - WG_ALLOWED_IPS=0.0.0.0/0,::/0
      # - WG_DISABLE_POST_UP=1
      # - WG_DISABLE_POST_DOWN=1
      # Optional: VPN-Clients nutzen ebenfalls Pi-hole
      - WG_DEFAULT_DNS=${HOST_IP}
    volumes:
      - /var/lib/wg-easy:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      - vpn-net

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    environment:
      TZ: Europe/Zurich
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      # Upstream: NICHT die Internet-Box eintragen (Schleife)
      FTLCONF_dns_upstreams: "9.9.9.9;149.112.112.112"
      FTLCONF_dns_listeningMode: "all"
      # Lokaler DNS-Eintrag: Domain -> interne IP von srv01
      FTLCONF_dns_hosts: "${HOST_IP} aegcegext.duckdns.org"
    ports:
      # An die LAN-IP binden, sonst Konflikt mit systemd-resolved auf Port 53
      - "${HOST_IP}:53:53/tcp"
      - "${HOST_IP}:53:53/udp"
      - "${HOST_IP}:8082:80/tcp"
    volumes:
      - /var/lib/pihole:/etc/pihole
    networks:
      - firefly-net

  viseca-upload:
    build:
      context: ./viseca-upload
      network: host          # nur für den Build: pip nutzt den DNS des Hosts
    container_name: viseca-upload
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - FIREFLY_URL=http://${HOST_IP}:8080
    volumes:
      - /home/chegl/control:/control
    ports:
      - "${HOST_IP}:8090:8000"
    networks:
      - firefly-net

networks:
  firefly-net:
    driver: bridge
  vpn-net:
    driver: bridge
